---
# Ansible playbook: deploy + run update-clean on AI blades
# Copyright (C) 2026 wbharris
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Usage:
#   ansible-playbook -i inventory.ini ansible/update-clean.yml
#   ansible-playbook -i inventory.ini ansible/update-clean.yml -e dry_run=true
#   ansible-playbook -i inventory.ini ansible/update-clean.yml -e 'extra_args=--check'
# update-clean exit 2 (reboot deferred, GPUs busy) is success, not a failed task.
#
# Inventory example (inventory.ini):
#   [gpu]
#   node001
#   node002
#   [gpu:vars]
#   ansible_user=ubuntu
#   ansible_become=true

- name: Deploy and run AI blade update-clean
  hosts: gpu
  gather_facts: true
  become: true
  vars:
    update_clean_src: "{{ playbook_dir }}/../update-clean.sh"
    update_clean_dest: /usr/local/sbin/update-clean.sh
    dry_run: false
    extra_args: ""
    skip_if_gpu_busy: true

  tasks:
    - name: Install update-clean.sh
      ansible.builtin.copy:
        src: "{{ update_clean_src }}"
        dest: "{{ update_clean_dest }}"
        mode: "0755"
        owner: root
        group: root

    - name: Check GPU compute process count
      ansible.builtin.shell: |
        set -o pipefail
        t="${GPU_CLI_TIMEOUT_SECS:-10}"
        run_to() {
          if command -v timeout >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=2 "$t" "$@"
          else
            "$@"
          fi
        }
        if command -v nvidia-smi >/dev/null 2>&1; then
          if ! out=$(run_to nvidia-smi --query-compute-apps=pid --format=csv,noheader,nounits 2>/dev/null); then
            printf 'unknown\n'
            exit 0
          fi
          printf '%s\n' "$out" | sed '/^[[:space:]]*$/d' | wc -l
          exit 0
        fi
        if command -v rocm-smi >/dev/null 2>&1; then
          if ! out=$(run_to rocm-smi --showpids 2>/dev/null); then
            printf 'unknown\n'
            exit 0
          fi
          n=$(printf '%s\n' "$out" | grep -cE '^[0-9]' || true)
          printf '%s\n' "${n// /}"
          exit 0
        fi
        printf 'unknown\n'
      args:
        executable: /bin/bash
      register: gpu_busy
      changed_when: false
      failed_when: false

    - name: Classify GPU busy probe
      ansible.builtin.set_fact:
        gpu_busy_state: >-
          {{
            'idle' if (gpu_busy.stdout | default('') | trim) == '0'
            else 'busy' if (gpu_busy.stdout | default('') | trim) is match('^[1-9][0-9]*$')
            else 'unknown'
          }}

    - name: Refuse update when GPU busy state is unknown
      ansible.builtin.fail:
        msg: "Refusing to update {{ inventory_hostname }}: GPU busy state is unknown"
      when:
        - skip_if_gpu_busy | bool
        - gpu_busy_state == 'unknown'

    - name: Skip node when GPUs are busy
      ansible.builtin.debug:
        msg: "Skipping {{ inventory_hostname }} — {{ gpu_busy.stdout | trim }} GPU process(es)"
      when:
        - skip_if_gpu_busy | bool
        - gpu_busy_state == 'busy'

    - name: Run update-clean
      ansible.builtin.command:
        argv: "{{ ([update_clean_dest] + (extra_args.split() if extra_args else []) + (['--dry-run'] if dry_run else [])) }}"
      register: uc_result
      when: (not (skip_if_gpu_busy | bool)) or gpu_busy_state == 'idle'
      # 0 = ok; 2 = reboot deferred; 3 = skipped (GPUs busy)
      changed_when: not dry_run and (uc_result.rc | default(0) | int) == 0
      failed_when: (uc_result.rc | default(1) | int) not in [0, 2, 3]

    - name: Show update-clean summary tail
      ansible.builtin.debug:
        msg: "{{ (uc_result.stdout_lines | default([]))[-30:] }}"
      when: uc_result is defined and uc_result.stdout_lines is defined
