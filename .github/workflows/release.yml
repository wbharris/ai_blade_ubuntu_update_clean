name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "VERSION=$ver does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build tarball
        run: |
          mkdir -p dist
          bash scripts/package-release.sh dist

      - name: Notes from CHANGELOG
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {p=1; print; next}
            p && $0 ~ /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > /tmp/notes.md
          {
            echo
            echo "Install (always the latest release):"
            echo
            echo '```bash'
            echo "curl -fsSL -o ai_blade_ubuntu_update_clean.tar.gz \\"
            echo "  https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ai_blade_ubuntu_update_clean.tar.gz"
            echo "tar -xzf ai_blade_ubuntu_update_clean.tar.gz"
            echo "cd ai_blade_ubuntu_update_clean"
            echo "sudo install -m 755 update-clean.sh /usr/local/sbin/update-clean.sh"
            echo '```'
          } >> /tmp/notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(
            dist/ai_blade_ubuntu_update_clean.tar.gz
            dist/ai_blade_ubuntu_update_clean.tar.gz.sha256
            dist/ai_blade_ubuntu_update_clean-*.tar.gz
            dist/ai_blade_ubuntu_update_clean-*.tar.gz.sha256
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --notes-file /tmp/notes.md \
              --latest \
              --verify-tag
          fi
