name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck (error severity)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: error
          check_together: 'yes'
          # Include nested fleet/bcm helpers
          additional_files: 'fleet/update-clean-fleet.sh bcm/bcm-hooks.sh'