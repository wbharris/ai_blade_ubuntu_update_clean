name: ShellCheck and smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run ShellCheck (error severity)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          severity: error
          check_together: 'yes'
          additional_files: 'fleet/update-clean-fleet.sh bcm/bcm-hooks.sh'

      - name: bash -n syntax
        run: |
          bash -n update-clean.sh
          bash -n fleet/update-clean-fleet.sh
          bash -n bcm/bcm-hooks.sh
          bash -n tests/simulate_nvidia_blade.sh
          bash -n tests/run_simulation.sh
          bash -n tests/test_bcm_hooks.sh
          bash -n tests/test_shell_units.sh
          bash -n tests/simulate_amd_blade.sh

      - name: BCM token sanitizers
        run: bash tests/test_bcm_hooks.sh

      - name: Shell unit tests (sourced functions)
        run: bash tests/test_shell_units.sh

      - name: CLI smoke (non-root)
        run: |
          ./update-clean.sh --help | head -5
          ./update-clean.sh --version
          ./update-clean.sh --check --offline || true

      - name: Dry-run smoke (root)
        env:
          UPDATE_CLEAN_SKIP_LOGS: "true"
        run: |
          sudo --preserve-env=UPDATE_CLEAN_SKIP_LOGS,CI \
            ./update-clean.sh --dry-run --offline --no-gpu-check --quiet

      - name: NVIDIA blade simulation
        run: sudo ./tests/simulate_nvidia_blade.sh

      - name: AMD ROCm blade simulation
        run: sudo ./tests/simulate_amd_blade.sh
